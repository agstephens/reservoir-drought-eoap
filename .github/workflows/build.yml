name: Build EO application package

# Self-contained equivalent of EO-DataHub/eoap-gen's generate-reusable.yml.
# (The upstream action installs Python 3.11, but eoap-gen now requires 3.13.)

on:
  push:
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  attestations: write
  id-token: write

env:
  CONFIG: config.yml
  OUTPUT: eoap-gen-out

jobs:
  # Run eoap-gen: CWL + Dockerfiles into eoap-gen-out/, committed back to the repo
  generate:
    runs-on: ubuntu-latest
    outputs:
      tools: ${{ steps.gen.outputs.tools }}
      image_base: ${{ steps.base.outputs.image_base }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Image base (registry paths must be lower case)
        id: base
        run: echo "image_base=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Install eoap-gen
        run: python -m pip install git+https://github.com/EO-DataHub/eoap-gen.git

      - name: Generate EOAP
        id: gen
        run: |
          eoap-gen generate \
            --config="$CONFIG" \
            --output="$OUTPUT" \
            --docker-url-base="${{ steps.base.outputs.image_base }}" \
            --docker-tag="${{ github.ref_name }}"

      - name: Commit generated files
        run: |
          git config --global user.email "github-actions@example.com"
          git config --global user.name "github-actions[bot]"
          git add "$OUTPUT"
          if git diff --cached --quiet; then
            echo "No changes to generated files."
          else
            git commit --no-verify -m "Generate EOAP"
            git pull --rebase
            git push origin "HEAD:${{ github.ref_name }}"
          fi

  # Build and push one image per script step to ghcr.io/<owner>/<repo>/<step>
  build-push:
    runs-on: ubuntu-latest
    needs: [generate]
    strategy:
      matrix:
        cli: ${{ fromJson(needs.generate.outputs.tools) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ needs.generate.outputs.image_base }}/${{ matrix.cli }}

      - id: push
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.OUTPUT }}/cli/${{ matrix.cli }}
          file: ${{ env.OUTPUT }}/cli/${{ matrix.cli }}/${{ matrix.cli }}.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ needs.generate.outputs.image_base }}/${{ matrix.cli }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  # Optional: (re)deploy the packed workflow to your EODH workspace ADES.
  # Needs secrets ADES_USER and ADES_TOKEN, and repository variable DEPLOY_TO_ADES=true.
  deploy:
    runs-on: ubuntu-latest
    needs: [build-push]
    if: ${{ vars.DEPLOY_TO_ADES == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyeodh
      - shell: python
        env:
          WF_ID: reservoir-drought
          ADES_USER: ${{ secrets.ADES_USER }}
          ADES_TOKEN: ${{ secrets.ADES_TOKEN }}
        run: |
          import os
          import pyeodh
          from requests import HTTPError
          wf_id = os.environ["WF_ID"]
          ades = pyeodh.Client(username=os.environ["ADES_USER"], token=os.environ["ADES_TOKEN"]).get_ades()
          with open(f"{os.environ.get('OUTPUT', 'eoap-gen-out')}/cli/workflow-packed.cwl") as f:
              cwl_yaml = f.read()
          try:
              ades.get_process(wf_id).delete()
          except HTTPError:
              print("Process not deployed yet.")
          proc = ades.deploy_process(cwl_yaml=cwl_yaml)
          print(f"{proc.id} deployed")
